<svg viewBox="0 0 960 570" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" font-family="-apple-system, 'SF Pro Text', 'Segoe UI', 'PingFang SC', 'Noto Sans SC', sans-serif">
  <defs>
    <!-- One path. The form is literally shared; only the ink changes. -->
    <g id="flask" stroke="currentColor" fill="none" stroke-width="2.25" stroke-linejoin="round" stroke-linecap="round">
      <path d="M -22,-186 L -22,-181 C -19,-176 -17,-166 -17,-158 L -17,-120 C -19,-110 -23,-102 -26,-96 A 100 100 0 0 0 -20,98 C -21,103 -22,109 -23.5,113 L -23.5,120 L 23.5,120 L 23.5,113 C 22,109 21,103 20,98 A 100 100 0 0 0 26,-96 C 23,-102 19,-110 17,-120 L 17,-158 C 17,-166 19,-176 22,-181 L 22,-186 Z"/>
      <path d="M -17,-146 C -34,-143 -45,-131 -43,-116 C -41,-104 -33,-95 -24,-90 L -21,-96 C -28,-100 -34,-106 -36,-115 C -38,-127 -30,-137 -16,-140 Z"/>
      <path d="M 17,-146 C 34,-143 45,-131 43,-116 C 41,-104 33,-95 24,-90 L 21,-96 C 28,-100 34,-106 36,-115 C 38,-127 30,-137 16,-140 Z"/>
    </g>
  </defs>

  <!-- drafting guides: rim / belly / foot -->
  <g stroke="#C9D0DA" stroke-width="1" stroke-dasharray="3 4">
    <line x1="120" y1="84"  x2="840" y2="84"/>
    <line x1="120" y1="270" x2="840" y2="270"/>
    <line x1="120" y1="391" x2="840" y2="391"/>
  </g>
  <g fill="#6B7688" font-size="9.5" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="848" y="87">rim 口</text>
    <text x="848" y="273">belly 腹</text>
    <text x="848" y="394">foot 足</text>
  </g>

  <!-- title block -->
  <text x="60" y="46" fill="#6B7688" font-size="11" letter-spacing="2.2">MING → QING · SOURCE-SPECIFIC SATURATION</text>
  <text x="60" y="76" fill="#1A2230" font-size="22" font-weight="600">The form stays. The cobalt does not.</text>

  <!-- center thesis -->
  <text x="480" y="160" fill="#1A2230" font-size="18" font-weight="600" text-anchor="middle">形留 · 料自主</text>
  <text x="480" y="181" fill="#6B7688" font-size="11.5" text-anchor="middle">form retained · material autonomous</text>

  <!-- the two vessels: one path, two inks -->
  <use xlink:href="#flask" x="250" y="270" color="#3D6098"/>
  <use xlink:href="#flask" x="710" y="270" color="#6094DC"/>

  <!-- captions -->
  <g text-anchor="middle">
    <text x="250" y="424" fill="#1A2230" font-size="13" font-weight="600">Yongle–Xuande flattened flask</text>
    <text x="250" y="442" fill="#6B7688" font-size="12">青花扁壶 · Art Institute of Chicago 259858</text>
    <line x1="192" y1="458" x2="216" y2="458" stroke="#3D6098" stroke-width="3"/>
    <text x="222" y="462" fill="#6B7688" font-size="11.5" text-anchor="start">cobalt: imported · 苏麻离青</text>

    <text x="710" y="424" fill="#1A2230" font-size="13" font-weight="600">Qianlong moon flask</text>
    <text x="710" y="442" fill="#6B7688" font-size="12">青花抱月瓶 · Palace Museum 故宫博物院</text>
    <line x1="655" y1="458" x2="679" y2="458" stroke="#6094DC" stroke-width="3"/>
    <text x="685" y="462" fill="#6B7688" font-size="11.5" text-anchor="start">cobalt: domestic · 国产钴料</text>
  </g>

  <!-- signature ruler: this page's real dimension is time -->
  <g stroke="#6B7688" stroke-width="1">
    <line x1="140" y1="508" x2="820" y2="508"/>
    <line x1="156.6" y1="499" x2="156.6" y2="508"/>
    <line x1="239.5" y1="503" x2="239.5" y2="508"/>
    <line x1="322.4" y1="499" x2="322.4" y2="508"/>
    <line x1="405.4" y1="503" x2="405.4" y2="508"/>
    <line x1="488.3" y1="499" x2="488.3" y2="508"/>
    <line x1="571.2" y1="503" x2="571.2" y2="508"/>
    <line x1="654.1" y1="499" x2="654.1" y2="508"/>
    <line x1="737.1" y1="503" x2="737.1" y2="508"/>
    <line x1="820"   y1="499" x2="820"   y2="508"/>
  </g>
  <!-- 1644: the transition itself -->
  <line x1="561.3" y1="492" x2="561.3" y2="508" stroke="#1A2230" stroke-width="1.5"/>
  <text x="561.3" y="488" fill="#1A2230" font-size="10.5" text-anchor="middle" font-weight="600">1644 明 → 清</text>

  <g fill="#6B7688" font-size="10.5" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace">
    <text x="156.6" y="526">1400</text>
    <text x="322.4" y="526">1500</text>
    <text x="488.3" y="526">1600</text>
    <text x="654.1" y="526">1700</text>
    <text x="820"   y="526">1800</text>
  </g>

  <!-- reign spans, colour-matched to the inks -->
  <line x1="161.6" y1="494" x2="214.6" y2="494" stroke="#3D6098" stroke-width="3"/>
  <text x="188" y="486" fill="#3D6098" font-size="11" text-anchor="middle">永乐–宣德 1403–1435</text>
  <line x1="714" y1="494" x2="811.8" y2="494" stroke="#6094DC" stroke-width="3"/>
  <text x="763" y="486" fill="#6094DC" font-size="11" text-anchor="middle">乾隆 1736–1795</text>

  <!-- caption -->
  <text x="60" y="554" fill="#6B7688" font-size="10.5" font-style="italic">One path, drawn twice — only the ink changes.</text>
  <text x="900" y="554" fill="#6B7688" font-size="10.5" text-anchor="end">profiles simplified from the two objects</text>
</svg>